<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>らくばる君のリズム配達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>らくばる君の<span>リズム配達</span></h1>
        <p class="sub">落ちてくるチラシを、リズムに合わせてポストへ。</p>
      </div>
      <a class="back" href="../">← ポスティング大作戦へ</a>
    </header>

    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="ゲーム画面"></canvas>
    </div>

    <section class="panel" id="panel" aria-label="ゲームの設定">
      <fieldset class="diff">
        <legend>むずかしさ</legend>
        <label><input type="radio" name="diff" value="easy"><span><b>かんたん</b><small id="best-easy">ベスト —</small></span></label>
        <label><input type="radio" name="diff" value="normal" checked><span><b>ふつう</b><small id="best-normal">ベスト —</small></span></label>
        <label><input type="radio" name="diff" value="hard"><span><b>むずかしい</b><small id="best-hard">ベスト —</small></span></label>
      </fieldset>

      <div class="opts">
        <label class="opt">
          <span>落ちる速さ <output id="speed-out">1.0</output></span>
          <input type="range" id="speed" min="0.6" max="2" step="0.1" value="1">
        </label>
        <label class="opt">
          <span>タイミング調整 <output id="offset-out">0ms</output></span>
          <input type="range" id="offset" min="-200" max="200" step="10" value="0">
          <small>音より遅れて押してしまうときは＋へ</small>
        </label>
        <label class="check"><input type="checkbox" id="sfx" checked> 叩いた音を鳴らす</label>
      </div>

      <button type="button" id="start" class="start">スタート</button>
    </section>

    <section class="howto">
      <div>
        <h2>操作</h2>
        <dl>
          <dt><kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd></dt><dd>左から1〜4番目のポストに配る</dd>
          <dt><kbd>←</kbd> <kbd>↓</kbd> <kbd>↑</kbd> <kbd>→</kbd></dt><dd>こちらでも同じように操作できます</dd>
          <dt>スマホ</dt><dd>画面を左右4つに分けてタップ</dd>
          <dt><kbd>Enter</kbd></dt><dd>スタート／もう一回</dd>
          <dt><kbd>Esc</kbd></dt><dd>一時停止</dd>
        </dl>
      </div>
      <div>
        <h2>ルール</h2>
        <p>チラシがポストに重なった瞬間にキーを押すと配達成功。ぴったりなほど高得点です。続けて成功するとコンボがつながります。</p>
        <p class="note">曲：「らくばる」</p>
      </div>
    </section>
  </main>

  <script src="charts.js"></script>
  <script src="game.js"></script>
</body>
</html>
