<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>らくばる君のポスティング大作戦</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>らくばる君の<span>ポスティング大作戦</span></h1>
        <p class="sub">スクーターで走りながら、60秒でどれだけのポストに配れるか。</p>
      </div>
      <div class="tools">
        <a class="other-game" href="rhythm/">♪ リズム配達で遊ぶ</a>
        <a class="other-game" href="hanabi/">✦ 花火大会で遊ぶ</a>
        <button id="mute" type="button" aria-pressed="false">音：オン</button>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="ゲーム画面"></canvas>
    </div>

    <div class="pad" aria-label="操作ボタン">
      <button type="button" data-act="up" aria-label="上の車線へ">▲</button>
      <button type="button" data-act="down" aria-label="下の車線へ">▼</button>
      <button type="button" data-act="left" aria-label="左へ">◀</button>
      <button type="button" data-act="right" aria-label="右へ">▶</button>
      <button type="button" data-act="throw" class="throw">チラシを投げる</button>
    </div>

    <section class="howto">
      <div>
        <h2>操作</h2>
        <dl>
          <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>車線を変える</dd>
          <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>前後に動く</dd>
          <dt><kbd>Space</kbd></dt><dd>チラシを投げる（画面タップでも可）</dd>
          <dt><kbd>M</kbd></dt><dd>音のオン・オフ</dd>
        </dl>
      </div>
      <div>
        <h2>配布のルール</h2>
        <p>チラシは真上に飛びます。青いポストの真下で投げると配達成功。続けて成功するとコンボで点数が上がります。チラシを外したり、「チラシ禁止」の貼り紙があるポストに入れたりすると残り時間が1秒減ります（禁止ポストはさらに減点）。</p>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
